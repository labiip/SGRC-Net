[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sgrc-net"
version = "0.1.0"
description = "State-guided residual calibration for visible-lumen segmentation"
requires-python = ">=3.10,<3.13"
dependencies = [
  "nnunetv2==2.5.2",
  "dynamic-network-architectures==0.3.1",
  "nibabel>=5.2,<6",
  "scikit-image>=0.24,<0.26",
  "threadpoolctl>=3.1,<4",
]

[tool.setuptools.packages.find]
where = ["code"]
